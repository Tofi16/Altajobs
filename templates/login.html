{% extends "base.html" %}
{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4 py-8 text-slate-100">
  <div class="w-full max-w-md bg-slate-900/95 border border-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-8">
    <div class="mb-8 text-center">
      <div class="text-4xl font-black tracking-tight text-white">AltaJobs <span class="text-cyan-300">.</span></div>
    </div>
    <form method="POST" action="{{ url_for('login') }}" class="space-y-5">
      <input type="hidden" name="next" value="{{ next or request.args.get('next','') }}" />
      <div>
        <label for="username" class="block text-sm font-semibold text-slate-300 mb-2">{{ t.username }}</label>
        <input id="username" name="username" type="text" autocomplete="username" required
               class="w-full rounded-2xl border border-white/10 bg-slate-950/80 px-4 py-3 text-slate-100 placeholder:text-slate-500 outline-none focus:border-cyan-300 focus:ring-2 focus:ring-cyan-300/20" />
      </div>
      <div>
        <label for="password" class="block text-sm font-semibold text-slate-300 mb-2">{{ t.password }}</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required
               class="w-full rounded-2xl border border-white/10 bg-slate-950/80 px-4 py-3 text-slate-100 placeholder:text-slate-500 outline-none focus:border-cyan-300 focus:ring-2 focus:ring-cyan-300/20" />
      </div>
      <button type="submit" class="w-full rounded-2xl bg-cyan-500 px-4 py-3 text-base font-semibold text-slate-950 transition hover:bg-cyan-400">{{ t.login }}</button>
    </form>
    <div class="mt-6 text-center text-sm text-slate-400">
      <span>{{ t.get('new_here', 'New here?') }}</span>
      <a href="{{ url_for('register') }}" class="font-semibold text-cyan-300 hover:text-cyan-200">{{ t.create_account }}</a>
    </div>
  </div>
</div>
{% endblock %}
