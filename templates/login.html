{% extends "base.html" %}

{% block extra_styles %}
<style>
  /* ===== Animated brand mark ===== */
  .brand-logo { display:inline-flex; align-items:center; gap:0.7rem; }
  .brand-mark {
    display:grid; place-items:center;
    width:3rem; height:3rem; flex-shrink:0;
    border-radius: 1.1rem;
    background: linear-gradient(135deg, #22d3ee, #3b82f6 45%, #8b5cf6);
    background-size: 220% 220%;
    animation: brandMarkShift 6s ease infinite, brandMarkFloat 4.5s ease-in-out infinite;
    box-shadow: 0 10px 32px -6px rgba(59,130,246,0.55), 0 0 0 1px rgba(255,255,255,0.08) inset;
    color: #04101f;
    font-size: 1.35rem;
  }
  @keyframes brandMarkShift { 0%,100%{background-position:0% 50%} 50%{background-position:100% 50%} }
  @keyframes brandMarkFloat { 0%,100%{transform:translateY(0) rotate(0deg)} 50%{transform:translateY(-5px) rotate(-3deg)} }
  .brand-text {
    font-size: 2.05rem; font-weight: 900; letter-spacing: -0.02em; line-height:1;
    background: linear-gradient(90deg, #67e8f9, #60a5fa, #a78bfa, #60a5fa, #67e8f9);
    background-size: 300% auto;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: brandTextShine 6s linear infinite;
  }
  @keyframes brandTextShine { to { background-position: -300% center; } }
  .brand-dot { color:#22d3ee; display:inline-block; animation: brandDotPulse 1.7s ease-in-out infinite; }
  @keyframes brandDotPulse { 0%,100%{opacity:1; transform:scale(1)} 50%{opacity:0.35; transform:scale(1.4)} }

  /* ===== Living background ===== */
  .auth-bg { position:absolute; inset:0; overflow:hidden; z-index:0; pointer-events:none; }
  .auth-orb { position:absolute; border-radius:50%; filter: blur(64px); }
  .auth-orb-1 { width:26rem; height:26rem; top:-9rem; left:-9rem; background:radial-gradient(circle at 30% 30%, rgba(34,211,238,0.55), transparent 70%); animation: orbFloat1 17s ease-in-out infinite; }
  .auth-orb-2 { width:24rem; height:24rem; bottom:-10rem; right:-7rem; background:radial-gradient(circle at 70% 70%, rgba(139,92,246,0.5), transparent 70%); animation: orbFloat2 21s ease-in-out infinite; }
  .auth-orb-3 { width:18rem; height:18rem; top:38%; left:58%; background:radial-gradient(circle, rgba(59,130,246,0.4), transparent 70%); animation: orbFloat3 23s ease-in-out infinite; }
  @keyframes orbFloat1 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(2.5rem,3.5rem) scale(1.12)} }
  @keyframes orbFloat2 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-2.5rem,-2rem) scale(1.08)} }
  @keyframes orbFloat3 { 0%,100%{transform:translate(0,0) scale(1)} 50%{transform:translate(-2rem,2.5rem) scale(0.9)} }
  .auth-grid {
    position:absolute; inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size: 42px 42px;
    -webkit-mask-image: radial-gradient(ellipse at center, black 0%, transparent 72%);
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 72%);
  }
  .auth-particle { position:absolute; bottom:-10px; border-radius:50%; background: rgba(103,232,249,0.7); animation-name: particleRise; animation-timing-function: linear; animation-iteration-count: infinite; }
  @keyframes particleRise {
    0% { transform:translateY(0) translateX(0); opacity:0; }
    12% { opacity:0.85; }
    88% { opacity:0.35; }
    100% { transform:translateY(-108vh) translateX(18px); opacity:0; }
  }

  /* ===== Form field icons ===== */
  .field-icon { font-size: 1.15rem; }
  .input-icon-wrap input { padding-left: 2.75rem; }
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center bg-slate-950 px-4 py-10 text-slate-100 relative overflow-hidden">

  <div class="auth-bg">
    <div class="auth-orb auth-orb-1"></div>
    <div class="auth-orb auth-orb-2"></div>
    <div class="auth-orb auth-orb-3"></div>
    <div class="auth-grid"></div>
    <span class="auth-particle" style="left:10%;width:3px;height:3px;animation-duration:10s;animation-delay:0.5s;"></span>
    <span class="auth-particle" style="left:22%;width:2px;height:2px;animation-duration:8.5s;animation-delay:2s;"></span>
    <span class="auth-particle" style="left:38%;width:4px;height:4px;animation-duration:13s;animation-delay:1.2s;"></span>
    <span class="auth-particle" style="left:55%;width:3px;height:3px;animation-duration:11s;animation-delay:3.4s;"></span>
    <span class="auth-particle" style="left:68%;width:2px;height:2px;animation-duration:9s;animation-delay:0.8s;"></span>
    <span class="auth-particle" style="left:80%;width:4px;height:4px;animation-duration:14s;animation-delay:2.6s;"></span>
    <span class="auth-particle" style="left:90%;width:3px;height:3px;animation-duration:12s;animation-delay:1.8s;"></span>
  </div>

  <div class="w-full max-w-md relative z-10">
    <div class="bg-slate-900/95 border border-white/10 backdrop-blur-xl rounded-3xl shadow-2xl p-8 sm:p-9">

      <!-- Animated logo -->
      <div class="mb-7 flex flex-col items-center text-center">
        <div class="brand-logo mb-3">
          <span class="brand-mark"><i class='bx bxs-briefcase'></i></span>
          <span class="brand-text">AltaJobs<span class="brand-dot">.</span></span>
        </div>
        <p class="text-sm text-slate-400">{{ t.get('login_subtitle', 'Welcome back — sign in to continue.') }}</p>
      </div>

      <form method="POST" action="{{ url_for('login') }}" class="space-y-5" novalidate>
        <input type="hidden" name="next" value="{{ next or request.args.get('next','') }}" />

        <!-- Username -->
        <div>
          <label for="username" class="block text-sm font-semibold text-slate-300 mb-2">{{ t.username }}</label>
          <div class="relative input-icon-wrap">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
              <i class='bx bx-user field-icon'></i>
            </span>
            <input id="username" name="username" type="text" autocomplete="username" required autofocus
                   placeholder="{{ t.get('username_placeholder', 'Enter your username') }}"
                   class="w-full rounded-2xl border border-white/10 bg-slate-950/80 pr-4 py-3 text-slate-100 placeholder:text-slate-500 outline-none focus:border-cyan-300 focus:ring-2 focus:ring-cyan-300/20 transition" />
          </div>
        </div>

        <!-- Password -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label for="password" class="block text-sm font-semibold text-slate-300">{{ t.password }}</label>
            <a href="{{ url_for('coming_soon', feature='password_reset') }}" class="text-xs font-medium text-cyan-300 hover:text-cyan-200">
              {{ t.get('forgot_password', 'Forgot password?') }}
            </a>
          </div>
          <div class="relative input-icon-wrap">
            <span class="pointer-events-none absolute inset-y-0 left-0 flex items-center pl-4 text-slate-500">
              <i class='bx bx-lock-alt field-icon'></i>
            </span>
            <input id="password" name="password" type="password" autocomplete="current-password" required
                   placeholder="{{ t.get('password_placeholder_login', 'Enter your password') }}"
                   class="w-full rounded-2xl border border-white/10 bg-slate-950/80 pr-11 py-3 text-slate-100 placeholder:text-slate-500 outline-none focus:border-cyan-300 focus:ring-2 focus:ring-cyan-300/20 transition" />
            <button type="button" data-toggle-for="password" aria-label="Toggle password visibility"
                    class="toggle-eye absolute inset-y-0 right-0 flex items-center pr-4 text-slate-500 hover:text-cyan-300 transition text-lg">
              <i class='bx bx-show eye-icon'></i>
            </button>
          </div>
        </div>

        <!-- Remember me -->
        <label class="flex items-center gap-2 text-sm text-slate-400 select-none cursor-pointer">
          <input type="checkbox" name="remember_me" class="h-4 w-4 rounded border-white/20 bg-slate-950/80 text-cyan-400 focus:ring-cyan-300/40 focus:ring-offset-0" />
          {{ t.get('remember_me', 'Remember me on this device') }}
        </label>

        <button type="submit"
                class="w-full rounded-2xl bg-cyan-500 px-4 py-3 text-base font-semibold text-slate-950 transition hover:bg-cyan-400">
          {{ t.login }}
        </button>
      </form>

      <div class="mt-6 text-center text-sm text-slate-400">
        <span>{{ t.get('new_here', 'New here?') }}</span>
        <a href="{{ url_for('register') }}" class="font-semibold text-cyan-300 hover:text-cyan-200">{{ t.create_account }}</a>
      </div>
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
  document.querySelectorAll('.toggle-eye').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var targetId = btn.getAttribute('data-toggle-for');
      var input = document.getElementById(targetId);
      var icon = btn.querySelector('.eye-icon');
      var isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      icon.classList.toggle('bx-show', !isHidden);
      icon.classList.toggle('bx-hide', isHidden);
    });
  });
});
</script>
{% endblock %}
