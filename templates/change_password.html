{% extends "base.html" %}
{% block content %}
<div class="max-w-xl mx-auto px-4 py-6">
  <h2 class="text-xl font-extrabold mb-4">Change Password</h2>
  <form method="POST" action="{{ url_for('change_password') }}" class="space-y-4 bg-zinc-900/60 border border-white/5 rounded-2xl p-6">
    <div>
      <label class="block text-sm font-semibold mb-1" for="current_password">Current Password</label>
      <input id="current_password" name="current_password" type="password" class="w-full rounded-xl border border-white/10 bg-zinc-950/70 p-3" required>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1" for="new_password">New Password</label>
      <input id="new_password" name="new_password" type="password" class="w-full rounded-xl border border-white/10 bg-zinc-950/70 p-3" required>
    </div>
    <div>
      <label class="block text-sm font-semibold mb-1" for="confirm_password">Confirm Password</label>
      <input id="confirm_password" name="confirm_password" type="password" class="w-full rounded-xl border border-white/10 bg-zinc-950/70 p-3" required>
    </div>
    <div class="text-right">
      <button type="submit" class="px-4 py-2 rounded-xl bg-sky-500 text-white">Save</button>
    </div>
  </form>
</div>
{% endblock %}
